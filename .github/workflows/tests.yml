# Lance les tests automatiques d'Easy Route à chaque pull request et à chaque mise à jour de main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Un fichier CSS ou JS modifié doit changer de numéro ?v= dans index.html
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Numéros ?v= à jour
        run: .github/check-version.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # Vrai code du Worker des liens courts, sur une base SQLite en mémoire (aucune installation)
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run test:worker

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-tests
          path: playwright-report/
          retention-days: 7
